#-----------------------------------------------#
#                   ChunkShield                 #
#                                               #
#                    MikeBloc                   #
#-----------------------------------------------#

# Check how ChunkShield maintains server health.
# https://github.com/mikebloc/ChunkShield/blob/main/Documentation/Technicalities%20Explained.MD

###############################
#        Configuration        #
###############################

# LANGUAGE SUPPORT
# 1 - English
# 2 - Spanish
# 3 - Russian
lang: 1

# When anything is purged, a small flame poofs.
# Does not occur during Chunk Loading and stops after 10 instantaneous removals.
PurgeEffects: true

# A HUGE CPU Saver. Minimum Threshold to justify checking a chunk at all.
# This only applies to Scan-Chunks-Upon-Loading.
MinimumEntityRequirement: 10    # Recommend 5 - 25.

# Amount to inform you of chunks with larger amounts of entities.
WarningRequirement: 50             # Recommend 50 - 70

# Notification Toggles (Must have chunkshield.alerts perm)
BlockLimits: true
EntityLimits: true
VehicleLimits: true
ChunkWarning: true
ChunkScanned: true

# 50% Toggle cuts the checks in half if you prefer.
# The general scan triggers when a chunk loads if it meets 6 criteria.
Scan-Chunks-Upon-Loading: true
Scan-Chunks-Upon-Loading-50%: false
# Checks block limit you set every time a player places a block.
BlockCheck: true
BlockCheck-50%: false
# Checks entity limit upon an entity spawning.
EntityCheck: true
EntityCheck-50%: false

# 10% Chance Misc Events that can trigger a chunk scan.
Scan-Chunk-Upon-Crafting: false
Scan-Chunk-Upon-Entity-Dying: false
Scan-Chunk-Upon-Opening-Container: false

# Prevent Server Lag/Crashing via checking vicinity limit for boats and mineCarts.
VehicleRadiusCheck: true

# READ ME
# Adding Portal Frames to list can break portals.
# This instead, prevents placement and removes any End Portal Frames found in the inventory.
end-portal-fix: true

###############################
#      Collective Checks      #
###############################
# Collective Chunk Limit for all Doors | Gates | Trapdoors. There are 40+
# Collective Chunk Limit for all Mine Carts | Boats | Rafts. There are 20+
# -1 to disable
ChunkDoorLimit: 40
ChunkVehicleLimit: 20
# Block radius to allow the vehicle limit within. (More than 20 Boats cant exist within 32 blocks.)
vehicle-radius: 32


###############################
#         Block Limits        #
###############################
# The amount of block items that can be in one chunk.

# DO NOT ADD:
# - Doors, read above.
# - End Portal Frames, read above.

# NOTE: Natural Bedrock is safe.
# NOTE: Use REDSTONE_WIRE, not "REDSTONE"
block-limits:
  ANVIL: 12
  CHIPPED_ANVIL: 12
  DAMAGED_ANVIL: 12
  BEACON: 16
  BEDROCK: 0
  CAMPFIRE: 64
  SOUL_CAMPFIRE: 64
  CHEST: 200
  TRAPPED_CHEST: 200
  ENCHANTING_TABLE: 8
  HOPPER: 32
  PISTON: 32
  STICKY_PISTON: 32
  REPEATER: 20
  COMPARATOR: 20
  REDSTONE_WIRE: 100

###############################
#     Named Entity Limits     #
###############################
# Named Entity limits PER chunk.
# These ADD onto the total of a mob. EX: 5 named and 2 unnamed are 7.
named-entity-limits:
  CAT: 5
  WOLF: 5
  HORSE: 5
  DONKEY: 5
  VILLAGER: 20

###############################
#        Entity Limits        #
###############################
# Individual entity limits PER chunk.
entity-limits:
  DROPPED_ITEM: 1000    #1000 can protect items if lots of chests get destroyed.

  ############ Items ############
  ARROW: 10
  ARMOR_STAND: 16
  EGG: 10
  EXPERIENCE_ORB: 35
  FALLING_BLOCK: 10
  FIREBALL: 3
  ITEM_FRAME: 64
  GLOW_ITEM_FRAME: 64
  PAINTING: 32
  PRIMED_TNT: 1
  SHULKER_BULLET: 8
  SNOWBALL: 10
  TRIDENT: 10

  ############ Mobs ############
  COW: 32
  CHICKEN: 32
  PIG: 32
  SHEEP: 32
  ENDER_DRAGON: 1
  GIANT: 0
  ILLUSIONER: 0
  PHANTOM: 1
  RAVAGER: 4
  SNOWMAN: 10
  VEX: 5
  VILLAGER: 32
  WITHER: 1
